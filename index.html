<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morocco River Basins</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  /* Panel text styling — change these values to restyle the info panel. */
  :root {
    --panel-title-color: #1b263b;
    --panel-title-size:  1.1em;
    --panel-text-color:  #555555;
    --panel-text-size:   0.9em;
  }
  html, body { height:100%; margin:0; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  #map { position:absolute; top:0; bottom:0; left:0; right:0; }
  .panel { background: rgba(255,255,255,0.94); border-radius: 6px; box-shadow: 0 1px 6px rgba(0,0,0,0.25); padding: 10px 12px; }
  .info-panel { position:absolute; top:12px; right:12px; z-index:1000; width:280px; max-width:calc(100vw - 24px); max-height:calc(100vh - 24px); overflow-y:auto; box-sizing:border-box; }
  .info-panel h1 { font-size: var(--panel-title-size); margin: 0 0 4px; color: var(--panel-title-color); }
  .info-panel .info-intro { display:block; font-size: var(--panel-text-size); color: var(--panel-text-color); line-height:1.35; }
  .info-panel .info-intro p { margin: 0 0 8px; }
  .info-panel .info-intro p:last-child { margin-bottom: 0; }
  .info-panel .info-title { font-size: var(--panel-title-size); font-weight:700; color: var(--panel-title-color); margin: 0 0 5px; }
  .info-panel .info-desc { font-size: var(--panel-text-size); line-height:1.4; color: var(--panel-text-color); margin: 0; }
  .basin-label { font-size:11px; font-weight:500; color:#1b263b; white-space:nowrap;
    text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 0 3px #fff;
    transform: translate(-50%, -50%); pointer-events:none; }
  .leaflet-control-attribution { font-size:10px; }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel info-panel" id="info-panel">
  <div id="info-placeholder">
    <h1>Morocco River Basins</h1>
    <span class="info-intro">
      <p>Hover (or tap) a shaded basin to see its name and description.</p>
    </span>
  </div>
  <div id="info-content" style="display:none;">
    <h2 class="info-title" id="info-title"></h2>
    <p class="info-desc" id="info-desc"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script>
(function () {
  "use strict";

  var SHAPES_URL = "basins_morocco.json";   // polygons (GeoJSON)
  var INFO_URL   = "basin-data.json";       // name + description per basin, joined on "code"

  var COLORS = ["#2a6f97", "#1b998b", "#b5651d", "#6a4c93", "#c1121f",
                "#588157", "#e08e0b", "#d6336c", "#4361ee", "#7f7f3a"];

  function defaultStyle(c) { return { color:c, weight:2, fillColor:c, fillOpacity:0.35, opacity:0.9 }; }
  function hoverStyle(c)   { return { color:c, weight:3, fillColor:c, fillOpacity:0.6,  opacity:1 }; }

  var map = L.map("map", { zoomControl: true }).setView([31.8, -7.1], 6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  var basinLayerGroup = L.featureGroup().addTo(map);
  var labelLayerGroup = L.layerGroup().addTo(map);
  var basinLayers = [];

  function updateInfoPanel(name, desc) {
    var ph = document.getElementById("info-placeholder");
    var ct = document.getElementById("info-content");
    if (name) {
      document.getElementById("info-title").textContent = name;
      document.getElementById("info-desc").textContent = desc || "";
      ct.style.display = "block"; ph.style.display = "none";
    } else {
      ct.style.display = "none"; ph.style.display = "block";
    }
  }
  function resetBasins() {
    basinLayers.forEach(function (l) { l.setStyle(l._defaultStyle); });
    updateInfoPanel(null);
  }
  function wire(layer, name, desc, color) {
    var def = defaultStyle(color), hov = hoverStyle(color);
    layer._defaultStyle = def; layer.setStyle(def);
    layer.on("mouseover", function () { layer.setStyle(hov); updateInfoPanel(name, desc); });
    layer.on("mouseout",  function () { layer.setStyle(def); updateInfoPanel(null); });
    layer.on("click", function (e) {
      L.DomEvent.stopPropagation(e);
      resetBasins(); layer.setStyle(hov); updateInfoPanel(name, desc);
    });
    basinLayers.push(layer);
  }
  map.on("click", resetBasins);

  function fetchJSON(url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error("Could not load " + url + " (HTTP " + r.status + ")");
      return r.json();
    });
  }

  Promise.all([fetchJSON(SHAPES_URL), fetchJSON(INFO_URL)])
    .then(function (res) {
      var shapes = res[0], infoByCode = {};
      res[1].basins.forEach(function (b) { infoByCode[b.code] = b; });

      shapes.features.forEach(function (f, i) {
        var code = f.properties.code, color = COLORS[i % COLORS.length];
        var info = infoByCode[code] || {};
        var name = info.name || f.properties.name, desc = info.description || "";
        var layer = L.geoJSON(f);
        layer.eachLayer(function (l) { wire(l, name, desc, color); });
        layer.addTo(basinLayerGroup);

        // Label at a point guaranteed to lie inside the basin
        var pt = turf.pointOnFeature(f).geometry.coordinates;
        var icon = L.divIcon({ className: "basin-label", html: name, iconSize: [0, 0] });
        L.marker([pt[1], pt[0]], { icon: icon, interactive: false }).addTo(labelLayerGroup);
      });
      map.fitBounds(basinLayerGroup.getBounds(), { padding: [20, 20] });
    })
    .catch(function (err) {
      console.error(err);
      document.getElementById("info-placeholder").innerHTML =
        '<p style="color:#a00;">Failed to load map data. Serve this folder over http (e.g. run "python -m http.server") and make sure basins_morocco.json and basin-data.json sit next to this file.</p>';
    });
})();
</script>
</body>
</html>
