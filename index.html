<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morocco River Basins</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  html, body { height:100%; margin:0; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  #map { position:absolute; top:0; bottom:0; left:0; right:0; }

  .panel {
    background: rgba(255,255,255,0.94);
    border-radius: 6px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.25);
    padding: 10px 12px;
  }
  .title-panel {
    position:absolute; top:12px; left:12px; z-index:1000;
    max-width: 260px;
  }
  .title-panel h1 { font-size:15px; margin:0 0 2px; color:#1b263b; }
  .title-panel p { font-size:11.5px; margin:0; color:#555; line-height:1.35; }

  .legend-panel {
    position:absolute; bottom:20px; left:12px; z-index:1000;
    font-size:12px; color:#1b263b;
  }
  .legend-panel .legend-title { font-weight:600; margin-bottom:6px; font-size:11.5px; color:#333; }
  .legend-row { display:flex; align-items:center; gap:7px; margin:3px 0; }
  .legend-swatch { width:14px; height:14px; flex:0 0 auto; border-radius:2px; border:1.5px solid rgba(0,0,0,0.35); }
  .legend-line { width:16px; height:0; border-top:1.5px solid #1b263b; flex:0 0 auto; }

  .basin-label {
    font-size: 11px;
    font-weight: 500;
    color: #1b263b;
    white-space: nowrap;
    text-shadow:
      -1px -1px 0 #fff, 1px -1px 0 #fff,
      -1px  1px 0 #fff, 1px  1px 0 #fff,
      0 0 3px #fff;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .region-tooltip {
    font-size: 13px;
    font-weight: 600;
    padding: 4px 9px;
  }

  .leaflet-control-attribution { font-size: 10px; }
</style>
</head>
<body>

<div id="map"></div>

<div class="panel title-panel">
  <h1>Morocco River Basins</h1>
  <p>Outlined shapes are sub-basins. Shaded areas are hydraulic regions &mdash; hover (or tap) a shaded area to see its name.</p>
</div>

<div class="panel legend-panel" id="legend"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script>
(function () {
  "use strict";

  var DATA_URL = "bassins.json";

  var REGION_COLORS = {
    "Atlantic North Basins":   "#2a6f97",
    "Atlantic Central Basins": "#b5651d",
    "Atlantic South Basins":   "#6a4c93",
    "Mediterranean Basin":     "#1b998b"
  };

  var BASIN_STYLE = { color: "#1b263b", weight: 1.2, fill: false, opacity: 0.85 };

  function regionDefaultStyle(color) {
    return { color: color, weight: 2, fillColor: color, fillOpacity: 0.45, opacity: 0.9 };
  }
  function regionHoverStyle(color) {
    return { color: color, weight: 3, fillColor: color, fillOpacity: 0.7, opacity: 1 };
  }

  var map = L.map("map", { zoomControl: true }).setView([31.5, -6.5], 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  var basinLayerGroup = L.featureGroup().addTo(map);
  var labelLayerGroup = L.layerGroup().addTo(map);
  var regionLayerGroup = L.layerGroup().addTo(map);
  var regionLayers = [];

  function resetRegions() {
    regionLayers.forEach(function (l) {
      l.setStyle(l._defaultStyle);
      l.closeTooltip();
    });
  }

  function wireRegionLayer(layer, name, color) {
    var def = regionDefaultStyle(color);
    var hov = regionHoverStyle(color);
    layer._defaultStyle = def;
    layer.setStyle(def);
    layer.bindTooltip(name, { sticky: true, direction: "top", className: "region-tooltip" });

    layer.on("mouseover", function () { layer.setStyle(hov); layer.openTooltip(); });
    layer.on("mouseout",  function () { layer.setStyle(def); layer.closeTooltip(); });
    layer.on("click", function (e) {
      L.DomEvent.stopPropagation(e);
      resetRegions();
      layer.setStyle(hov);
      layer.openTooltip(e.latlng);
    });
    regionLayers.push(layer);
  }

  map.on("click", resetRegions);

  function buildLegend(regionNames) {
    var el = document.getElementById("legend");
    var html = '<div class="legend-title">Legend</div>';
    html += '<div class="legend-row"><span class="legend-line"></span><span>Sub-basin outline</span></div>';
    regionNames.forEach(function (name) {
      var color = REGION_COLORS[name] || "#888";
      html += '<div class="legend-row"><span class="legend-swatch" style="background:' + color +
              ';border-color:' + color + '"></span><span>' + name + '</span></div>';
    });
    el.innerHTML = html;
  }

  fetch(DATA_URL)
    .then(function (r) {
      if (!r.ok) throw new Error("Could not load " + DATA_URL + " (HTTP " + r.status + ")");
      return r.json();
    })
    .then(function (data) {
      var features = data.features;

      // --- Basin outlines + name labels ---
      features.forEach(function (f) {
        L.geoJSON(f, { style: BASIN_STYLE }).addTo(basinLayerGroup);

        var name = f.properties.NomSousBas;
        if (name) {
          var pt = turf.pointOnFeature(f);
          var lng = pt.geometry.coordinates[0], lat = pt.geometry.coordinates[1];
          var icon = L.divIcon({ className: "basin-label", html: name, iconSize: [0, 0] });
          L.marker([lat, lng], { icon: icon, interactive: false }).addTo(labelLayerGroup);
        }
      });

      // --- Region groups (dissolve basins sharing REGION) ---
      var byRegion = {};
      features.forEach(function (f) {
        var region = f.properties.REGION;
        if (!region) return;
        (byRegion[region] = byRegion[region] || []).push(f);
      });

      var regionNames = Object.keys(byRegion);
      regionNames.forEach(function (name) {
        var feats = byRegion[name];
        var merged;
        try {
          merged = feats.length === 1
            ? feats[0]
            : turf.union(turf.featureCollection(feats), { properties: { REGION: name } });
        } catch (err) {
          console.error("Union failed for region", name, err);
          merged = feats[0];
        }
        if (!merged) return;
        var color = REGION_COLORS[name] || "#888888";
        var layer = L.geoJSON(merged);
        layer.eachLayer(function (l) { wireRegionLayer(l, name, color); });
        layer.addTo(regionLayerGroup);
      });

      buildLegend(regionNames);

      map.fitBounds(basinLayerGroup.getBounds(), { padding: [20, 20] });
    })
    .catch(function (err) {
      console.error(err);
      document.getElementById("legend").innerHTML =
        '<div style="color:#a00;max-width:220px;">Failed to load ' + DATA_URL +
        '. Make sure it sits in the same folder as this HTML file.</div>';
    });
})();
</script>
</body>
</html>
